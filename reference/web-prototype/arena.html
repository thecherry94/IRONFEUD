<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mech AI Arena</title>
<style>
  html,body{margin:0;height:100%;background:#8d98a0;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e8e4dc;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  #ui{position:fixed;top:10px;right:10px;bottom:10px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
  #ui>*{pointer-events:auto}
  #tog{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff30;background:#15181cd0;color:#ffb067;font-size:18px;cursor:pointer;flex:none}
  #panel{background:#15181ce0;border:1px solid #ffffff25;border-radius:10px;padding:10px 12px;width:258px;overflow-y:auto;max-height:100%;box-sizing:border-box;backdrop-filter:blur(6px)}
  #panel.hide{display:none}
  .row{display:flex;gap:5px;margin:3px 0 9px}
  .row button{flex:1;padding:6px 0;border-radius:6px;border:1px solid #ffffff30;background:#23272d;color:#ddd;font:inherit;font-size:11px;cursor:pointer}
  .row button.on{background:#b5642b;border-color:#ff9a4a;color:#fff}
  h1{font-size:11px;margin:2px 0 4px;color:#ffb067;letter-spacing:.08em;font-weight:600}
  hr{border:0;border-top:1px solid #ffffff20;margin:8px 0}
  .kv{display:flex;justify-content:space-between;font-size:11px;margin:2px 0}
  .lbl{opacity:.7}
  .bar{height:6px;background:#ffffff15;border-radius:3px;overflow:hidden;flex:1}
  .bar i{display:block;height:100%;width:0;background:#7dffb0}
  .srow{display:flex;align-items:center;gap:6px;font-size:10.5px;margin:2px 0}
  .srow span{width:58px}
  .srow b{width:30px;text-align:right;font-weight:400;opacity:.8}
  .srow.on span{color:#ffb067;font-weight:700}
  .srow.on .bar i{background:#ff8a2a}
  #selName{font-size:14px;font-weight:700}
  #selAction{font-size:16px;font-weight:700;color:#ffb067;margin:4px 0 2px}
  #selWhy{font-size:10.5px;opacity:.75;min-height:14px}
  select{background:#23272d;color:#ddd;border:1px solid #ffffff30;border-radius:5px;font:inherit;font-size:11px;padding:2px 4px}
  #log{font-size:10.5px;line-height:1.5;opacity:.85;min-height:60px}
  #log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  label.chk{font-size:11px;display:flex;gap:6px;align-items:center;margin:2px 0 6px}
  #tags{position:fixed;inset:0;pointer-events:none;z-index:4}
  .tag{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;cursor:pointer;font-size:11px;padding:3px 6px;border-radius:5px;background:#15181cc0;border:1px solid currentColor;white-space:nowrap}
  .tag .hb{height:3px;background:#ffffff25;margin-top:2px;border-radius:2px;overflow:hidden}
  .tag .hb i{display:block;height:100%;background:currentColor}
  .tag .act{font-size:9.5px;opacity:.8;color:#e8e4dc}
  .tag.sel{background:#2a2016e0;box-shadow:0 0 0 2px currentColor}
  .tag.dead{opacity:.45}
  #card{position:fixed;left:10px;bottom:10px;z-index:5;background:#15181cd0;border:1px solid #ffffff25;border-radius:8px;padding:6px 10px;font-size:11px;min-width:170px}
  #feed{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
  #feed div{background:#15181cd0;border:1px solid #ffffff25;border-radius:6px;padding:4px 10px;font-size:11.5px;transition:opacity .6s}
  #banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:7;font-size:28px;font-weight:800;letter-spacing:.1em;padding:14px 26px;border-radius:10px;background:#15181ce0;border:2px solid #ffb067;display:none;text-align:center}
  #banner small{display:block;font-size:12px;font-weight:400;letter-spacing:0;opacity:.8;margin-top:6px}
  #hint{position:fixed;left:10px;top:10px;z-index:5;font-size:11px;opacity:.75;background:#15181c90;padding:5px 8px;border-radius:6px}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="tags"></div>
<div id="feed"></div>
<div id="banner"></div>
<div id="hint">tap a mech or its tag to inspect · drag to orbit · pinch/scroll to zoom</div>
<div id="card"></div>

<div id="ui">
  <button id="tog" aria-label="Toggle panel">⚙</button>
  <div id="panel">
    <h1>MATCH</h1>
    <div class="row"><button data-mode="1v1" class="on">1 v 1</button><button data-mode="2v2">2 v 2</button><button id="restart">Restart</button></div>
    <h1>TIME</h1>
    <div class="row"><button data-spd="0">⏸</button><button data-spd="0.25">¼×</button><button data-spd="1" class="on">1×</button><button data-spd="2">2×</button><button data-spd="4">4×</button></div>
    <h1>CAMERA</h1>
    <div class="row cams"><button data-cam="overview" class="on">Overview</button><button data-cam="follow">Follow</button><button data-cam="chase">Chase</button><button data-cam="cockpit">Cockpit</button></div>
    <label class="chk"><input type="checkbox" id="dbg" checked> Debug overlay (path, LOS, cover, lead)</label>
    <hr>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span id="selName">—</span>
      <select id="selPers"><option value="brawler">Brawler</option><option value="balanced">Balanced</option><option value="sniper">Sniper</option></select>
    </div>
    <div id="selAction">—</div>
    <div id="selWhy"></div>
    <div id="scores"></div>
    <hr>
    <div class="kv"><span class="lbl">Target</span><span id="selTgt">—</span></div>
    <div class="kv"><span class="lbl">Range · LOS</span><span id="selRng">—</span></div>
    <div class="kv"><span class="lbl">Aim error σ</span><span id="selErr">—</span></div>
    <div class="kv"><span class="lbl">Shots · hits · dmg</span><span id="selStats">—</span></div>
    <div class="srow"><span>Heat</span><div class="bar"><i id="hHeat"></i></div><b id="hHeatT"></b></div>
    <div class="srow"><span>Torso</span><div class="bar"><i id="hTorso"></i></div><b id="hTorsoT"></b></div>
    <div class="srow"><span>L arm·laser</span><div class="bar"><i id="hArmL"></i></div><b id="hArmLT"></b></div>
    <div class="srow"><span>R arm·cannon</span><div class="bar"><i id="hArmR"></i></div><b id="hArmRT"></b></div>
    <div class="srow"><span>Legs</span><div class="bar"><i id="hLegs"></i></div><b id="hLegsT"></b></div>
    <hr>
    <h1>DECISION LOG</h1>
    <div id="log"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- utils ----------
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const smoother = t => t * t * t * (t * (t * 6 - 15) + 10);
class Spring {
  constructor(freq, zeta) { this.k = (TAU * freq) ** 2; this.c = 2 * zeta * Math.sqrt(this.k); this.x = 0; this.v = 0; }
  step(target, h) { const a = this.k * (target - this.x) - this.c * this.v; this.v += a * h; this.x += this.v * h; return this.x; }
}

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const FOG = 0x8d98a0;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 70, 280);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 600);

scene.add(new THREE.HemisphereLight(0xdfe6ec, 0x5a4e40, 1.5));
const sun = new THREE.DirectionalLight(0xfff0dd, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 160 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const groundTex = canvasTex(512, (g, s) => {
  g.fillStyle = '#5d564c'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 5000; i++) { const v = 70 + Math.random() * 40 | 0; g.fillStyle = `rgba(${v},${v - 6},${v - 14},0.35)`; g.fillRect(Math.random() * s, Math.random() * s, 2 + Math.random() * 3, 2 + Math.random() * 3); }
  g.strokeStyle = 'rgba(30,28,24,0.55)'; g.lineWidth = 3; g.strokeRect(0, 0, s, s);
  g.strokeStyle = 'rgba(30,28,24,0.22)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(s / 2, 0); g.lineTo(s / 2, s); g.moveTo(0, s / 2); g.lineTo(s, s / 2); g.stroke();
});
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(40, 40);
const panelTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#b8bcc0'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 1500; i++) { const v = 165 + Math.random() * 35 | 0; g.fillStyle = `rgba(${v},${v},${v},0.3)`; g.fillRect(Math.random() * s, Math.random() * s, 2, 2); }
  g.strokeStyle = 'rgba(40,40,40,0.7)'; g.lineWidth = 2; g.strokeRect(6, 6, s - 12, s - 12);
  g.beginPath(); g.moveTo(6, s * 0.55); g.lineTo(s - 6, s * 0.55); g.stroke();
  g.fillStyle = 'rgba(50,50,50,0.8)';
  for (const [x, y] of [[16, 16], [s - 16, 16], [16, s - 16], [s - 16, s - 16]]) { g.beginPath(); g.arc(x, y, 3.5, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(90,60,40,0.25)'; for (let i = 0; i < 6; i++) g.fillRect(Math.random() * s, s * 0.55 + Math.random() * 40, 30 + Math.random() * 40, 3);
});
const dustTex = canvasTex(64, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(150,135,115,0.9)'); gr.addColorStop(1, 'rgba(150,135,115,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});

const M = {
  armor: new THREE.MeshStandardMaterial({ color: 0x9aa1a8, map: panelTex, metalness: 0.25, roughness: 0.55 }),
  armorDark: new THREE.MeshStandardMaterial({ color: 0x6a7077, map: panelTex, metalness: 0.3, roughness: 0.6 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x3e4249, metalness: 0.45, roughness: 0.5 }),
  accent: new THREE.MeshStandardMaterial({ color: 0xc46a2c, metalness: 0.2, roughness: 0.55 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xc8cdd2, metalness: 0.6, roughness: 0.25 }),
  glow: new THREE.MeshStandardMaterial({ color: 0x221100, emissive: 0xff7a1a, emissiveIntensity: 2.2 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x0c1820, metalness: 0.9, roughness: 0.08, emissive: 0x0b3a4a, emissiveIntensity: 0.7 }),
  lens: new THREE.MeshStandardMaterial({ color: 0x200000, emissive: 0xff2a1a, emissiveIntensity: 2.5 }),
  hole: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 1 }),
};

function group(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
function box(parent, w, h, d, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function cyl(parent, rt, rb, h, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, seg = 18) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}


scene.fog.near = 160; scene.fog.far = 480;
camera.far = 900; camera.updateProjectionMatrix();
const V3 = THREE.Vector3;

// ---------- arena ----------
const ARENA = 95;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95 }));
groundTex.repeat.set(70, 70);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const ring = new THREE.Mesh(new THREE.RingGeometry(ARENA + 4, ARENA + 6, 96), new THREE.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0.35 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; scene.add(ring);

const propMats = [
  new THREE.MeshStandardMaterial({ color: 0x6d675e, roughness: 0.9, map: panelTex }),
  new THREE.MeshStandardMaterial({ color: 0x5a5f63, roughness: 0.8, metalness: 0.2, map: panelTex }),
  new THREE.MeshStandardMaterial({ color: 0x7b6f60, roughness: 0.95, map: panelTex }),
];
const solids = [];
{
  // seeded so every match uses the same map
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let tries = 0;
  while (solids.length < 36 && tries++ < 4000) {
    const w = 5 + rnd() * 11, d = 5 + rnd() * 11, h = 5 + rnd() ** 1.6 * 20;
    const x = (rnd() * 2 - 1) * (ARENA - 8), z = (rnd() * 2 - 1) * (ARENA - 8);
    if (Math.hypot(x, z) > ARENA - 6) continue;
    if (Math.abs(z) > 62 && Math.abs(x) < 26) continue;           // keep spawn zones open
    let ok = true;
    for (const s of solids) {
      const b = s.userData.box;
      if (x + w / 2 + 9 > b.min.x && x - w / 2 - 9 < b.max.x && z + d / 2 + 9 > b.min.z && z - d / 2 - 9 < b.max.z) { ok = false; break; }
    }
    if (!ok) continue;
    const m = box(scene, w, h, d, propMats[solids.length % 3], x, h / 2, z);
    m.userData.box = new THREE.Box3(new V3(x - w / 2, 0, z - d / 2), new V3(x + w / 2, h, z + d / 2));
    solids.push(m);
  }
  const rockGeo = new THREE.DodecahedronGeometry(1, 0);
  for (let i = 0; i < 90; i++) {
    const m = new THREE.Mesh(rockGeo, propMats[2]);
    const s = 0.3 + rnd() * 1.1;
    m.scale.set(s * (1 + rnd()), s, s * (1 + rnd()));
    const a = rnd() * TAU, r = rnd() * (ARENA + 40);
    m.position.set(Math.cos(a) * r, s * 0.4, Math.sin(a) * r);
    m.rotation.set(rnd() * 3, rnd() * 3, 0);
    m.castShadow = m.receiveShadow = true; scene.add(m);
  }
}
// cover points around every block
const coverPts = [];
for (const s of solids) {
  const b = s.userData.box, o = 4.5;
  const cx = (b.min.x + b.max.x) / 2, cz = (b.min.z + b.max.z) / 2;
  const cand = [[b.min.x - o, cz], [b.max.x + o, cz], [cx, b.min.z - o], [cx, b.max.z + o],
    [b.min.x - o, b.min.z - o], [b.max.x + o, b.min.z - o], [b.min.x - o, b.max.z + o], [b.max.x + o, b.max.z + o]];
  for (const [x, z] of cand) {
    if (Math.hypot(x, z) > ARENA - 3) continue;
    if (insideAnyBox(x, z, 2.5)) continue;
    coverPts.push({ x, z, h: b.max.y });
  }
}
function insideAnyBox(x, z, pad) {
  for (const s of solids) { const b = s.userData.box; if (x > b.min.x - pad && x < b.max.x + pad && z > b.min.z - pad && z < b.max.z + pad) return true; }
  return false;
}

// ---------- ray utilities ----------
const ray = new THREE.Ray(), vHit = new V3(), vTmp = new V3(), vTmp2 = new V3(), sph = new THREE.Sphere();
function boxHitDist(origin, dir, maxD) {
  let best = maxD;
  ray.set(origin, dir);
  for (const s of solids) {
    if (ray.intersectBox(s.userData.box, vHit)) { const d = vHit.distanceTo(origin); if (d < best) best = d; }
  }
  return best;
}
function losClear(a, b) {
  vTmp.subVectors(b, a); const len = vTmp.length(); vTmp.divideScalar(len);
  return boxHitDist(a, vTmp, len) >= len - 0.3;
}
function segHitsSphere(a, b, c, r) {
  vTmp2.subVectors(b, a); const len = vTmp2.length(); vTmp2.divideScalar(len);
  ray.set(a, vTmp2); sph.center.copy(c); sph.radius = r;
  const hit = ray.intersectSphere(sph, vHit);
  return hit && vHit.distanceTo(a) < len;
}

// ---------- team materials ----------
const TEAM = [
  { name: 'ALPHA', css: '#ff9a4a', armor: M.armor, armorDark: M.armorDark, accent: M.accent },
  { name: 'BRAVO', css: '#5ab4ff',
    armor: new THREE.MeshStandardMaterial({ color: 0x8a96a2, map: panelTex, metalness: 0.25, roughness: 0.55 }),
    armorDark: new THREE.MeshStandardMaterial({ color: 0x4d5864, map: panelTex, metalness: 0.3, roughness: 0.6 }),
    accent: new THREE.MeshStandardMaterial({ color: 0x2f7fb5, metalness: 0.2, roughness: 0.55 }) },
];

// ---------- mech factory ----------
const L1 = 3.2, L2 = 3.3, ANK = 0.62, HIPW = 1.6, H0 = 5.75;
function buildMech(T) {
  const A = T.armor, AD = T.armorDark, AC = T.accent, F = M.frame;
  const extras = [];
  const pelvis = group(scene, 0, H0, 0); pelvis.rotation.order = 'YXZ';
  box(pelvis, 2.6, 1.1, 1.9, F);
  box(pelvis, 2.2, 0.7, 2.1, AD, 0, -0.25, 0.05);
  box(pelvis, 1.0, 1.3, 0.45, A, 0, -0.35, 1.08, 0.15);
  box(pelvis, 1.2, 0.9, 0.4, AD, 0, -0.2, -1.08, -0.15);
  for (const s of [-1, 1]) {
    cyl(pelvis, 0.68, 0.68, 0.7, F, s * 1.3, -0.1, 0, 0, 0, Math.PI / 2);
    cyl(pelvis, 0.42, 0.42, 0.8, AC, s * 1.3, -0.1, 0, 0, 0, Math.PI / 2);
  }
  function buildLeg(side, off) {
    const root = group(pelvis, side * HIPW, -0.15, 0);
    const hip = group(root); hip.rotation.order = 'ZXY';
    cyl(hip, 0.55, 0.55, 0.95, F, 0, 0, 0, 0, 0, Math.PI / 2);
    box(hip, 0.9, L1 * 0.9, 1.0, F, 0, -L1 * 0.5, 0);
    box(hip, 1.15, L1 * 0.75, 0.35, A, 0, -L1 * 0.45, 0.62, -0.05);
    box(hip, 0.25, L1 * 0.7, 1.15, AD, side * 0.6, -L1 * 0.48, 0);
    box(hip, 0.3, 0.28, 1.0, AC, side * 0.72, -0.85, 0);
    const knee = group(hip, 0, -L1, 0);
    cyl(knee, 0.5, 0.5, 1.05, F, 0, 0, 0, 0, 0, Math.PI / 2);
    box(knee, 1.0, 0.95, 0.5, A, 0, 0.05, 0.62, 0.25);
    box(knee, 0.8, L2 * 0.9, 0.9, F, 0, -L2 * 0.5, -0.05);
    box(knee, 1.15, L2 * 0.78, 0.4, A, 0, -L2 * 0.42, 0.56, 0.06);
    box(knee, 1.05, 0.85, 1.25, AD, 0, -L2 * 0.8, -0.1);
    box(knee, 0.12, 0.55, 0.3, M.glow, side * 0.5, -L2 * 0.8, -0.35);
    const ankle = group(knee, 0, -L2, 0);
    cyl(ankle, 0.42, 0.42, 0.9, F, 0, 0, 0, 0, 0, Math.PI / 2);
    box(ankle, 0.9, 0.4, 0.9, F, 0, -0.1, 0);
    box(ankle, 1.5, 0.45, 1.5, AD, 0, -0.37, 0.1);
    for (const tx of [-0.52, 0, 0.52]) {
      box(ankle, 0.42, 0.38, 1.05, A, tx, -0.42, 1.2);
      box(ankle, 0.3, 0.18, 0.25, F, tx, -0.5, 1.8);
    }
    box(ankle, 0.95, 0.36, 1.0, A, 0, -0.43, -0.95, -0.08);
    box(ankle, 0.1, 0.3, 1.4, AC, side * 0.76, -0.38, 0.1);
    const pistons = [-0.38, 0.38].map(px => {
      const outer = new THREE.Mesh(pistonOuterGeo, F), rod = new THREE.Mesh(pistonRodGeo, M.chrome);
      outer.castShadow = rod.castShadow = true; scene.add(outer, rod); extras.push(outer, rod);
      return { px, outer, rod };
    });
    return { side, off, root, hip, knee, ankle, pistons };
  }
  const legs = [buildLeg(+1, 0), buildLeg(-1, 0.5)];
  const torsoBase = group(pelvis, 0, 0.55, 0); torsoBase.rotation.order = 'YXZ';
  cyl(torsoBase, 0.75, 0.95, 0.8, F, 0, 0.25, 0, 0, 0, 0, 12);
